name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fact bundles: schema, source resolution, dependency resolution, derived
      # records, and the committed facts/index.json must be current.
      - run: npm run facts:check
      - run: npm run build
      - run: npm test
