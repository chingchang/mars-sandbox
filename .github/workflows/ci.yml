name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Fact bundles: schema, source resolution, dependency resolution, derived
      # records, and the committed facts/index.json must be current.
      - run: npm run facts:check
      # Nothing that looks like an API key may be in a tracked file, and .env is never tracked.
      - run: npm run check:secrets
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  # Deploy from main once the tests are green, and only then. The owner adds FLY_API_TOKEN to the
  # repository secrets (nothing deploys until it exists) and WORKSHOP_URL to the repository
  # variables so the deployed site is checked afterwards without a key or a code.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy-production
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      WORKSHOP_URL: ${{ vars.WORKSHOP_URL }}
    steps:
      - uses: actions/checkout@v4
      - name: Is a deploy token set?
        id: token
        run: |
          if [ -n "$FLY_API_TOKEN" ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; echo "FLY_API_TOKEN is not set: nothing deployed"; fi
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.token.outputs.present == 'true'
      - name: Deploy (fly.toml, Dockerfile)
        if: steps.token.outputs.present == 'true'
        run: flyctl deploy --remote-only
      - uses: actions/setup-node@v4
        if: steps.token.outputs.present == 'true' && env.WORKSHOP_URL != ''
        with:
          node-version: 22
      - name: Check the deployed site (no key, no code)
        if: steps.token.outputs.present == 'true' && env.WORKSHOP_URL != ''
        run: node scripts/deploy_check.mjs "$WORKSHOP_URL"
